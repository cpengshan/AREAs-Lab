# AUNUEnv environment config — policy is external

# LLM models
agent_model: gpt-4.1
agent_model_temperature: 0.7

user_model: gpt-4.1
user_model_temperature: 0.7

evaluator_model: gpt-4.1
evaluator_model_temperature: 0.7

# Environment
max_steps: 15

# MIMIC user — passive mode
user_mode: passive

# For persona mode, uncomment and set:
# user_mode: persona
# persona_config:
#   expertise_level: intermediate
#   verbosity: moderate
#   ambiguity_tolerance: medium
#   preference_stability: stable
#   communication_style: neutral

# Data — paths are resolved automatically from dataset_name
dataset_name: alexfabbri/multi_news

# LLM defaults (read by external policy)
temperature: 0.0
max_tokens: 8192

# Output
output_dir: ../../results/user_only

verbose: false
