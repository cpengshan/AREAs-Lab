# AUNUEnv environment config — policy is external

# LLM models
agent_model: gpt-4.1
agent_model_temperature: 0.7

user_model: gpt-4.1
user_model_temperature: 0.7

evaluator_model: gpt-4.1
evaluator_model_temperature: 0.7

# Environment
max_steps: 5

# User (passive — no persona)
user_mode: passive

# Data — paths are resolved automatically from dataset_name
dataset_name: alexfabbri/multi_news

# LLM defaults (read by external policy)
temperature: 0.0
max_tokens: 8192

# Output
output_dir: ../../results/zero_shot

verbose: false
