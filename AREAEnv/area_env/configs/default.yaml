# AUNUEnv environment config — policy is external

# LLM models
user_model: gemini-3.1-pro-preview
user_model_temperature: 0.7

evaluator_model: gpt-5.4
evaluator_model_temperature: 0.0

# MIMIC user — passive mode
user_mode: passive

# For persona mode, uncomment and set:
# user_mode: persona
# persona_config:
#   expertise_level: intermediate
#   verbosity: moderate
#   ambiguity_tolerance: medium
#   preference_stability: stable
#   communication_style: neutral

# LLM defaults (read by external policy)
temperature: 0.0
max_tokens: 12288

verbose: false

# Sampled data file used by the inspect_data action
data_sampled_file: data_sampled_2.7.json

# Synthesized output file used to load personas and tasks
synthesized_output_file: synthesized_output_2.6.json
